$kind: http-request
url: "{{baseUrl}}/api/admin/categories"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "categoryName": "Other Name {{runId}}",
      "slug": "test-category-{{runId}}",
      "description": "Created by the Postman suite"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 409", () => pm.response.to.have.status(409));
      pm.test("Error body has status 409", () => pm.expect(pm.response.json().status).to.eql(409));
    language: text/javascript
order: 3000
