$kind: http-request
url: "{{baseUrl}}/api/admin/categories/999999999"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "categoryName": "Ghost {{runId}}",
      "slug": "ghost-{{runId}}",
      "description": "Created by the Postman suite"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 404", () => pm.response.to.have.status(404));
      pm.test("Error body has status 404", () => pm.expect(pm.response.json().status).to.eql(404));
    language: text/javascript
order: 10000
