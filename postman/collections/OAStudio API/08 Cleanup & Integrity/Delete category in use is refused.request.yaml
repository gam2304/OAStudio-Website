$kind: http-request
url: "{{baseUrl}}/api/admin/categories/{{categoryId}}"
method: DELETE
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 409", () => pm.response.to.have.status(409));
      pm.test("Error body has status 409", () => pm.expect(pm.response.json().status).to.eql(409));
    language: text/javascript
order: 1000
