$kind: http-request
url: "{{baseUrl}}/api/admin/projects"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Duplicate {{runId}}",
      "slug": "test-villa-{{runId}}",
      "location": "Tunis, Tunisia",
      "year": 2024,
      "description": "Created by the Postman suite.",
      "architecturalConcept": "Mass and light.",
      "area": 350.5,
      "status": "DRAFT",
      "categoryId": {{categoryId}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 409", () => pm.response.to.have.status(409));
      pm.test("Error body has status 409", () => pm.expect(pm.response.json().status).to.eql(409));
    language: text/javascript
order: 5000
