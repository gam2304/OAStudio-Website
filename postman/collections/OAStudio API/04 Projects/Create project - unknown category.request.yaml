$kind: http-request
url: "{{baseUrl}}/api/admin/projects"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Test Villa {{runId}}",
      "slug": "no-category-{{runId}}",
      "location": "Tunis, Tunisia",
      "year": 2024,
      "description": "Created by the Postman suite.",
      "architecturalConcept": "Mass and light.",
      "area": 350.5,
      "status": "DRAFT",
      "categoryId": 999999999
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 404", () => pm.response.to.have.status(404));
      pm.test("Error body has status 404", () => pm.expect(pm.response.json().status).to.eql(404));
    language: text/javascript
order: 6000
