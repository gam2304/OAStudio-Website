$kind: http-request
url: "{{baseUrl}}/api/public/projects"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Contains test project", () => pm.expect(pm.response.json().map(p => p.id)).to.include(Number(pm.collectionVariables.get("projectId"))));
    language: text/javascript
order: 19000
