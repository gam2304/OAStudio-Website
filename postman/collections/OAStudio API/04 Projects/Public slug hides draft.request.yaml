$kind: http-request
url: "{{baseUrl}}/api/public/projects/{{projectSlug}}"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 404", () => pm.response.to.have.status(404));
      pm.test("Error body has status 404", () => pm.expect(pm.response.json().status).to.eql(404));
    language: text/javascript
order: 12000
