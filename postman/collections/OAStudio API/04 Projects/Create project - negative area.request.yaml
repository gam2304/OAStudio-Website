$kind: http-request
url: "{{baseUrl}}/api/admin/projects"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Test Villa {{runId}}",
      "slug": "bad-area-{{runId}}",
      "location": "Tunis, Tunisia",
      "year": 2024,
      "description": "Created by the Postman suite.",
      "architecturalConcept": "Mass and light.",
      "area": -1,
      "status": "DRAFT",
      "categoryId": {{categoryId}}
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 400", () => pm.response.to.have.status(400));
      pm.test("Validation messages name the bad fields", () => {
          const m = pm.response.json().messages;
          pm.expect(m, "messages.area").to.have.property("area");
      });
    language: text/javascript
order: 4000
