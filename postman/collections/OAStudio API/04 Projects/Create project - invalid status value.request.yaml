$kind: http-request
url: "{{baseUrl}}/api/admin/projects"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Test Villa {{runId}}",
      "slug": "bad-status-{{runId}}",
      "location": "Tunis, Tunisia",
      "year": 2024,
      "description": "Created by the Postman suite.",
      "architecturalConcept": "Mass and light.",
      "area": 350.5,
      "status": "FINISHED",
      "categoryId": {{categoryId}}
    }
scripts:
  - type: afterResponse
    code: pm.test("Status is 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 7000
