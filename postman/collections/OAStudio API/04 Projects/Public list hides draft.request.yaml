$kind: http-request
url: "{{baseUrl}}/api/public/projects"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Does not contain test project", () => pm.expect(pm.response.json().map(p => p.id)).to.not.include(Number(pm.collectionVariables.get("projectId"))));
      pm.test("Only PUBLISHED projects are public", () => pm.response.json().forEach(p => pm.expect(p.status).to.eql("PUBLISHED")));
    language: text/javascript
order: 11000
