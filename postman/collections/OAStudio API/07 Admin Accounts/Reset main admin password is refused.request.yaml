$kind: http-request
url: "{{baseUrl}}/api/admin/admins/{{superAdminId}}/password"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "newPassword": "Whatever123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 403", () => pm.response.to.have.status(403));
      pm.test("Error body has status 403", () => pm.expect(pm.response.json().status).to.eql(403));
    language: text/javascript
order: 14000
