$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "tmpadmin{{runId}}",
      "password": "TempPass-{{runId}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.collectionVariables.set("tempToken", pm.response.json().accessToken);
    language: text/javascript
order: 5000
