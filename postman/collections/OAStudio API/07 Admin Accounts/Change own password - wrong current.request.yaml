$kind: http-request
url: "{{baseUrl}}/api/admin/account/password"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "wrong-{{runId}}",
      "newPassword": "TempPass2-{{runId}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{tempToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 400", () => pm.response.to.have.status(400));
      pm.test("Error body has status 400", () => pm.expect(pm.response.json().status).to.eql(400));
    language: text/javascript
order: 8000
