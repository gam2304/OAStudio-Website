$kind: http-request
url: "{{baseUrl}}/api/admin/admins/{{tempAdminId}}/password"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "newPassword": "TempPass3-{{runId}}"
    }
scripts:
