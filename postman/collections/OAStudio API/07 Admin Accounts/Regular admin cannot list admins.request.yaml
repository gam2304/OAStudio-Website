$kind: http-request
url: "{{baseUrl}}/api/admin/admins"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{tempToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 403", () => pm.response.to.have.status(403));
      pm.test("Error body has status 403", () => pm.expect(pm.response.json().status).to.eql(403));
    language: text/javascript
order: 6000
