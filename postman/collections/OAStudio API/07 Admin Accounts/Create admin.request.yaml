$kind: http-request
url: "{{baseUrl}}/api/admin/admins"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "tmpadmin{{runId}}",
      "password": "TempPass-{{runId}}",
      "email": "tmp-{{runId}}@example.com"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201", () => pm.response.to.have.status(201));

      const a = pm.response.json();
      pm.test("Created as regular ADMIN", () => pm.expect(a.role).to.eql("ADMIN"));
      pm.collectionVariables.set("tempAdminId", a.id);
    language: text/javascript
order: 3000
