$kind: http-request
url: "{{baseUrl}}/api/admin/account/password"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "",
      "newPassword": "short"
    }
auth:
  type: bearer
  credentials:
    token: "{{tempToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 400", () => pm.response.to.have.status(400));
      pm.test("Validation messages name the bad fields", () => {
          const m = pm.response.json().messages;
          pm.expect(m, "messages.currentPassword").to.have.property("currentPassword");
          pm.expect(m, "messages.newPassword").to.have.property("newPassword");
      });
    language: text/javascript
order: 9000
