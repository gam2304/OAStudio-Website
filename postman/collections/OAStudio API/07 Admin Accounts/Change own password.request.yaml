$kind: http-request
url: "{{baseUrl}}/api/admin/account/password"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "TempPass-{{runId}}",
      "newPassword": "TempPass2-{{runId}}"
    }
auth:
  type: bearer
  credentials:
    token: "{{tempToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Status is 204", () => pm.response.to.have.status(204));
    language: text/javascript
order: 10000
