$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "nobody-{{runId}}",
      "password": "whatever"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 401", () => pm.response.to.have.status(401));
      pm.test("Error body has status 401", () => pm.expect(pm.response.json().status).to.eql(401));
    language: text/javascript
order: 2000
