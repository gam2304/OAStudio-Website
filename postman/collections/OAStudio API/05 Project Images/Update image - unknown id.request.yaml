$kind: http-request
url: "{{baseUrl}}/api/admin/project-images/999999999"
method: PUT
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "imageUrl": "https://res.cloudinary.com/demo/image/upload/sample.jpg",
      "altText": "Facade {{runId}}",
      "displayOrder": 1
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 404", () => pm.response.to.have.status(404));
      pm.test("Error body has status 404", () => pm.expect(pm.response.json().status).to.eql(404));
    language: text/javascript
order: 7000
