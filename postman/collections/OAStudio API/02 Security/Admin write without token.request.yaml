$kind: http-request
url: "{{baseUrl}}/api/admin/categories"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "categoryName": "Should not exist {{runId}}",
      "slug": "should-not-exist-{{runId}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test("Status is 401", () => pm.response.to.have.status(401));
    language: text/javascript
order: 3000
