$kind: http-request
url: "{{baseUrl}}/api/admin/projects"
method: GET
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 401", () => pm.response.to.have.status(401));
      pm.test("Error body has status 401", () => pm.expect(pm.response.json().status).to.eql(401));
      pm.test("WWW-Authenticate: Bearer", () => pm.response.to.have.header("WWW-Authenticate", "Bearer"));
    language: text/javascript
order: 1000
