$kind: http-request
url: "{{baseUrl}}/api/admin/projects"
method: GET
auth:
  type: noauth
scripts:
  - type: beforeRequest
    code: 'pm.request.headers.upsert({key: "Authorization", value: "{{bearer_token_070o}}"});'
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Status is 401", () => pm.response.to.have.status(401));
      pm.test("Error body has status 401", () => pm.expect(pm.response.json().status).to.eql(401));
    language: text/javascript
order: 2000
