services:
  postgres:
    image: postgres:17
    container_name: oastudio_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: oastudio_db
      POSTGRES_USER: ${DB_USERNAME:-oastudio}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}

    ports:
      - "5432:5432"

    volumes:
      - oastudio_pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-oastudio} -d oastudio_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  oastudio_pgdata:
