spring.application.name=oastudio-api
spring.config.import=optional:file:../../.env[.properties],optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/oastudio_db
spring.datasource.username=${DB_USERNAME:oastudio}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.formal_sql=true
spring.jpa.open-in-view=false

# JWT RSA keys
app.security.jwt.private-key=file:./keys/jwt-private.pem
app.security.jwt.public-key=file:./keys/jwt-public.pem
# JWT configuration
app.security.jwt.issuer=oastudio-api
app.security.jwt.access-token-expiration=900

# Initial administrator bootstrap
app.admin.bootstrap.enabled=${ADMIN_BOOTSTRAP_ENABLED:false}
app.admin.bootstrap.username=${ADMIN_USERNAME:}
app.admin.bootstrap.email=${ADMIN_EMAIL:}
app.admin.bootstrap.password=${ADMIN_PASSWORD:}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Multipart file upload limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Allowed browser origins (comma-separated) for the admin/public frontend
app.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:5173}

server.port=${SERVER_PORT:9001}

