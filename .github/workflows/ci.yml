name: CI

# Runs the backend and frontend checks on every push and pull request
on:
  push:
  pull_request:

# A newer push to the same branch cancels the run that is still going
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/oastudio-api

    # Real PostgreSQL for the context-load test (OastudioApiApplicationTests)
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: oastudio_db
          POSTGRES_USER: oastudio
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oastudio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_USERNAME: oastudio
      DB_PASSWORD: ci-password
      # The CI database starts empty, so let Hibernate create the schema instead of validating it
      SPRING_JPA_HIBERNATE_DDL_AUTO: create
      # Dummy values: tests never call Cloudinary, but the properties must resolve
      CLOUDINARY_CLOUD_NAME: ci
      CLOUDINARY_API_KEY: ci
      CLOUDINARY_API_SECRET: ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The real keys are git-ignored; throwaway keys let the JWT beans start
      - name: Generate throwaway JWT keys
        run: |
          mkdir -p keys
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out keys/jwt-private.pem
          openssl pkey -in keys/jwt-private.pem -pubout -out keys/jwt-public.pem

      - name: Run tests
        run: sh ./mvnw -B test

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/oastudio-web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/oastudio-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # tsc -b type-checks, then vite builds the production bundle
      - name: Type-check and build
        run: npm run build
